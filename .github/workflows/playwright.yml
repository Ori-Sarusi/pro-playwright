name: Playwright E2E UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Playwright E2E UI Tests (Chromium)
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium browser only
        run: npx playwright install chromium --with-deps

      - name: Execute Playwright UI test suite on Chromium
        run: npx playwright test --project=chromium

      - name: Upload Playwright Test HTML Report artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
