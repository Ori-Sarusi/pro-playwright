name: Playwright Test Automation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright E2E & API Suites
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Project Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers with Dependencies
        run: npx playwright install --with-deps

      - name: 🚀 Execute Playwright Tests (Shards ${{ matrix.shard }})
        run: npx playwright test --shard=${{ matrix.shard }}
        env:
          CI: true

      - name: 📊 Upload Test Results & Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  merge-reports:
    name: Consolidate Test Reports
    if: ${{ !cancelled() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📥 Download Shard Reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: 📋 Merge Sharded Reports
        run: npx playwright merge-reports ./all-reports --reporter html

      - name: 📊 Upload Consolidated HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-playwright-report
          path: playwright-report/
          retention-days: 30
